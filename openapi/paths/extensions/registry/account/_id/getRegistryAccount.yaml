summary: Get Registry Publisher Account
description: Fetch a publisher account from the Directus extension marketplace registry.
operationId: getRegistryAccount
parameters:
- $ref: ../../../../../components/parameters.yaml#/UUId
responses:
  '200':
    description: Successful request
    content:
      application/json:
        schema:
          type: object
          properties:
            data:
              type: object
              description: Publisher account details.
              properties:
                username:
                  type: string
                  description: Publisher username.
                verified:
                  type: boolean
                  description: Whether the publisher is verified.
                github_name:
                  type: string
                  nullable: true
                  description: Publisher GitHub username.
  '401':
    $ref: ../../../../../components/responses.yaml#/UnauthorizedError
  '404':
    $ref: ../../../../../components/responses.yaml#/NotFoundError
security: []
tags:
- Extensions
x-codeSamples:
  - label: Directus SDK
    lang: JavaScript
    source: |
      import { createDirectus, rest, readRegistryAccount } from '@directus/sdk';

      const client = createDirectus('directus_project_url').with(rest());

      const result = await client.request(readRegistryAccount('publisher_id'));
  - label: GraphQL
    lang: GraphQL
    source: |
      // Not supported in GraphQL
